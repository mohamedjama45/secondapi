name: Laravel CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Set environment variables for Laravel DB connection
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: secondapi
      DB_USERNAME: root
      DB_PASSWORD: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: secondapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup PHP with required extensions
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath
          coverage: xdebug

      # 3️⃣ Install Composer dependencies
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist

      # 4️⃣ Copy .env and generate app key
      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # 5️⃣ Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          for i in {1..10}; do
            mysql -h 127.0.0.1 -u root -proot -e "SHOW DATABASES;" && break
            echo "Waiting for MySQL..."
            sleep 3
          done

      # 6️⃣ Run migrations
      - name: Run migrations
        run: php artisan migrate --force

      # 7️⃣ Run tests
      - name: Run tests
        run: php artisan test --no-interaction
