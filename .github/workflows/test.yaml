name: Laravel CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_DATABASE: secondapi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath
          coverage: xdebug

      # 3. Install Composer dependencies
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist

      # 4. Setup .env and app key
      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # 5. Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          for i in {1..10}; do
            mysql -h 127.0.0.1 -u root -e "SHOW DATABASES;" && break
            echo "Waiting for MySQL..."
            sleep 3
          done

      # 6. Run migrations
      - name: Run migrations
        run: php artisan migrate --force

      # 7. Run tests
      - name: Run tests
        run: php artisan test
